<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Portfolio Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="dashboard">
    <div class="profile-header" id="profileHeader">
      <p>Loading your GitHub profile...</p>
    </div>

    <h2 class="section-title">Your Repositories</h2>
    <div class="repo-grid" id="repoGrid">
      <!-- Repo cards will be inserted here by JavaScript -->
    </div>
  </div>


  <div class="portfolio-controls">
  <input type="text" id="portfolioTitle" placeholder="Portfolio title (e.g. Adesh Wardhe - Full Stack Developer)" class="input-field">
  <textarea id="portfolioTagline" placeholder="Short tagline about yourself" class="input-field" rows="2"></textarea>
  <div class="button-row">
    <button id="saveBtn" class="btn-secondary">💾 Save Portfolio</button>
    <button id="publishBtn" class="btn-primary-small">🌐 Publish Portfolio</button>
  </div>
  <p id="publishMessage" class="publish-message"></p>
</div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
